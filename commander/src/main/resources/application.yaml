
spring:
  application:
    name: commander

  http:
    client:
      connect-timeout: 5s
      read-timeout: 300s

  datasource:
    url: jdbc:postgresql://localhost:5433/commander
    username: commander
    password: ${DB_PASSWORD}

  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false

  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat.options:
        model: qwen3:8b
        temperature: 0.1

server:
  port: 8080

commander:
  prometheus-url: http://localhost:9090
  analysis-timeout-seconds: 600
logging:
  pattern:
    level: "%5p [req=%X{requestId:-} inc=%X{incidentId:-} prop=%X{proposalId:-} run=%X{runId:-} user=%X{actor:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
