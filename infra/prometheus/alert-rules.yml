groups:
  - name: service-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
          / sum by (application) (rate(http_server_requests_seconds_count[1m])) > 0.05
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Error rate above 5% on {{ $labels.application }}"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket[1m]))) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s on {{ $labels.application }}"

      - alert: ServiceDown
        expr: up == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"