route:
  receiver: commander
  group_by: ["alertname", "application"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: commander
    webhook_configs:
      - url: http://host.docker.internal:8080/api/alerts
        send_resolved: true
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /etc/alertmanager/webhook_password